[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt && playwright install chromium && apt-get install -y libasound2t64 libgbm1 libnss3 libxss1 libasound2-dev libatk1.0-0 libcups2 libdbus-1-3 libdrm2 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxrender1 || true && playwright install chromium"

[deploy]
startCommand = "python bot.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
